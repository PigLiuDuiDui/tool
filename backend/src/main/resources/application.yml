# 轻工具箱 — 公共配置
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: light-toolbox
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 80MB
  data:
    redis:
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-use-long-secret-key-32bytes}
    expire-seconds: ${APP_JWT_EXPIRE_SECONDS:86400}
  security:
    permit-all:
      - /auth/wx-login
      - /tools/catalog
      - /actuator/health
      - /static-files/**
  wechat:
    mock: ${WECHAT_MOCK:true}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    mock-open-id: ${WECHAT_MOCK_OPEN_ID:dev-openid-light-toolbox}
  photo:
    worker-url: ${PHOTO_WORKER_URL:http://127.0.0.1:8091}
  doc:
    worker-url: ${DOC_WORKER_URL:http://127.0.0.1:8092}
  quota:
    daily-limit: ${QUOTA_DAILY_LIMIT:10}
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    retain-hours: ${FILE_RETAIN_HOURS:24}

logging:
  level:
    root: INFO
    com.lighttoolbox: DEBUG
