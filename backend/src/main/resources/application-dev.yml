spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:light_toolbox}
    username: ${DB_USER:toolbox}
    password: ${DB_PASSWORD:toolbox123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:1}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-key-please-change-32b}
  wechat:
    mock: true

logging:
  level:
    com.lighttoolbox: DEBUG
