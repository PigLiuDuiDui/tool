spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:light_toolbox}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  wechat:
    mock: false
    app-id: ${WECHAT_APP_ID}
    app-secret: ${WECHAT_APP_SECRET}

logging:
  level:
    com.lighttoolbox: INFO
